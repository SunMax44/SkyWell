name: ETL

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      CDSAPI_RC: /home/runner/work/SkyWell/SkyWell/.github/workflows/.cdsapirc

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 7-days-MVP/requirements.txt

      # Test the .cdsapirc file and verify it's being used
      - name: Check .cdsapirc content
        run: |
          echo "Checking .cdsapirc file content:"
          cat /home/runner/work/SkyWell/SkyWell/.github/workflows/.cdsapirc

      # Run ETL script
      - name: Run ETL script
        working-directory: 7-days-MVP
        run: |
          python etl/fetch_cams_air_data.py
          python etl/fetch_uv_data.py
