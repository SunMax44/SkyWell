name: ETL

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      CAMS_API_TOKEN: ${{ secrets.CAMS_API_TOKEN }}  # GitHub Secret for CAMS API Token

    steps:
      # Step 1: Checkout code from the repository
      - name: Checkout code
        uses: actions/checkout@v3
        
      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
        
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 7-days-MVP/requirements.txt

      # Step 4: Run ETL script to fetch data
      - name: Run ETL script
        working-directory: 7-days-MVP
        run: |
          python etl/fetch_cams_air_data.py
          python etl/fetch_uv_data.py
