name: ETL

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      CAMS_API_KEY: ${{ secrets.CAMS_API_KEY }}
      CDSAPI_RC: /home/runner/work/SkyWell/SkyWell/.github/workflows/.cdsapirc
      IS_GITHUB_ACTIONS: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 7-days-MVP/requirements.txt

      # Step to correctly populate the .cdsapirc file with the secret at the right path
      - name: Create .cdsapirc with API key at correct path
        run: |
          echo "url: https://ads.atmosphere.copernicus.eu/api" > /home/runner/work/SkyWell/SkyWell/.github/workflows/.cdsapirc
          echo "key: ${CAMS_API_KEY}" >> /home/runner/work/SkyWell/SkyWell/.github/workflows/.cdsapirc

      # Check the .cdsapirc file to ensure the key substitution works
      - name: Check .cdsapirc content
        run: cat /home/runner/work/SkyWell/SkyWell/.github/workflows/.cdsapirc

      # Run ETL script
      - name: Run ETL script
        working-directory: 7-days-MVP
        run: |
          python etl/fetch_cams_air_data.py
          python etl/fetch_uv_data.py

      - name: Harmonise to COG grid
        working-directory: 7-days-MVP
        run: |
          python core/grid.py

      - name: Cache raw data
        uses: actions/cache@v3
        with:
          path: 7-days-MVP/raw/cams
          key: raw-data-${{ runner.os }}-${{ hashFiles('**/raw/cams/*.zip') }}
          restore-keys: |
            raw-data-${{ runner.os }}-
