name: ETL

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      CAMS_API_TOKEN: ${{ secrets.CAMS_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create .cdsapirc
        run: |
          echo "url: https://cds.climate.copernicus.eu/api" > ~/.cdsapirc
          echo "key: $CAMS_API_TOKEN" >> ~/.cdsapirc
      - name: Run ETL script
        run: |
          python etl/fetch_cams_air_data.py
          python etl/fetch_uv_data.py 